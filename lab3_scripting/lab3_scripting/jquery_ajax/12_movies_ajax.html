<!DOCTYPE html>
<html>
<head>
    <title>Movies List via AJAX</title>
    <style>
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ccc; padding: 6px 8px; font-size: 0.85em; }
        th { background: #f0f0f0; }
        img { width: 60px; }
    </style>
</head>
<body>

<h2>Movies</h2>
<button onclick="loadMovies()">Load Movies</button>

<table id="movieTable">
    <thead>
        <tr>
            <th>ID</th><th>Title</th><th>Poster</th><th>Year</th><th>Genre</th>
            <th>Rating</th><th>Director</th><th>Country</th><th>Language</th><th>Actors</th>
        </tr>
    </thead>
    <tbody id="movieBody"></tbody>
</table>

<script>
function loadMovies() {
    const xhttp = new XMLHttpRequest();
    xhttp.onreadystatechange = function() {
        if (this.readyState === 4 && this.status === 200) {
            const movies = JSON.parse(this.responseText);
            let rows = "";
            movies.forEach(function(movie) {
                rows += "<tr>"
                    + "<td>" + movie.id + "</td>"
                    + "<td>" + movie.title + "</td>"
                    + "<td><img src='" + movie.poster + "'></td>"
                    + "<td>" + movie.year + "</td>"
                    + "<td>" + (Array.isArray(movie.genre) ? movie.genre.join(", ") : movie.genre) + "</td>"
                    + "<td>" + movie.rating + "</td>"
                    + "<td>" + movie.director + "</td>"
                    + "<td>" + movie.country + "</td>"
                    + "<td>" + movie.language + "</td>"
                    + "<td>" + (Array.isArray(movie.actors) ? movie.actors.join(", ") : movie.actors) + "</td>"
                    + "</tr>";
            });
            document.getElementById("movieBody").innerHTML = rows;
        }
    };
    xhttp.open("GET", "https://freetestapi.com/api/v1/movies", true);
    xhttp.send();
}
</script>

</body>
</html>
