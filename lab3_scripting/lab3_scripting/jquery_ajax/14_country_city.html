<!DOCTYPE html>
<html>
<head>
    <title>Country - City Dropdown</title>
</head>
<body>

<h2>Select Country and City</h2>

<label>Country:</label>
<select id="country" onchange="loadCities()">
    <option value="">-- Select Country --</option>
    <option value="Nepal">Nepal</option>
    <option value="India">India</option>
    <option value="USA">USA</option>
</select>

<br><br>

<label>City:</label>
<select id="city">
    <option value="">-- Select City --</option>
</select>

<script>
function loadCities() {
    const country = document.getElementById("country").value;
    const citySelect = document.getElementById("city");
    citySelect.innerHTML = "<option value=''>-- Select City --</option>";

    if (country === "") return;

    const xhttp = new XMLHttpRequest();
    xhttp.onreadystatechange = function() {
        if (this.readyState === 4 && this.status === 200) {
            const cities = JSON.parse(this.responseText);
            cities.forEach(function(city) {
                const option = document.createElement("option");
                option.value = city;
                option.text = city;
                citySelect.appendChild(option);
            });
        }
    };
    xhttp.open("GET", "14_get_cities.php?country=" + encodeURIComponent(country), true);
    xhttp.send();
}
</script>

</body>
</html>
